[project]
name = "basketball-ai"
version = "0.0.1"
description = "Basketball video analysis: detection, tracking, identity and events from game clips."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "pillow>=10.4",
  "pydantic>=2.9",
]

[project.optional-dependencies]
# Detection models (Colab/Kaggle). Not installed in CI.
cv = [
  "ultralytics>=8.3",
]

[dependency-groups]
dev = [
  "mypy>=1.13",
  "pytest>=8.3",
  "ruff>=0.8",
]

[project.scripts]
bball-doctor = "basketball_ai.doctor:main"
bball-inventory = "basketball_ai.inventory:main"
bball-run = "basketball_ai.pipeline:main"
bball-schemas = "basketball_ai.schemas:main"
bball-sample-frames = "basketball_ai.sampling:main"
bball-build-dataset = "basketball_ai.dataset:main"
bball-train = "basketball_ai.training:main"
bball-crops = "basketball_ai.crops:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/basketball_ai"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["ultralytics", "ultralytics.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
